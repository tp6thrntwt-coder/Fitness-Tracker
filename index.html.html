<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<title>Fitness Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: #F7F7F5; }
  button { cursor: pointer; border: none; font-family: 'Barlow', sans-serif; }
  input, textarea { font-family: 'Barlow', sans-serif; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const DAY_TYPES = [
  { id:"walk", label:"🚶 Walk Only", cal:"2,000–2,300", units:3, color:"#2D6A4F", bg:"#F0FBF4" },
  { id:"walk_lift", label:"🏋️ Walk + Lift", cal:"2,400–2,700", units:4, color:"#E07B39", bg:"#FEF6EE" },
  { id:"walk_sport", label:"🏓 Walk + Sport", cal:"2,900–3,400", units:5, color:"#4A7FCB", bg:"#EEF4FF" },
  { id:"all", label:"🔥 Lift + Sport + Walk", cal:"3,200–3,600", units:6, color:"#C77DBB", bg:"#FDF2F8" },
];

const MEALS = [
  { id:"breakfast_a", label:"Breakfast A", desc:"3 eggs + cheese + fruit", cal:380, protein:28 },
  { id:"breakfast_b", label:"Breakfast B (Power)", desc:"RX Bar + Oikos Pro + coffee", cal:365, protein:32 },
  { id:"dinner_a", label:"Dinner A", desc:"Chicken breast + veggies", cal:400, protein:48 },
  { id:"dinner_b", label:"Dinner B", desc:"Chicken + orzo + spinach/broccoli", cal:625, protein:52 },
  { id:"dinner_c", label:"Dinner C", desc:"Ground beef + sweet potato + cheese", cal:700, protein:42 },
  { id:"chipotle", label:"Chipotle Bowl", desc:"Chicken, brown rice, extra cheese, corn, pico, lettuce", cal:725, protein:52 },
  { id:"mexican_active", label:"Mexican (Active Day)", desc:"3 soft tacos, ground beef, extra cheese", cal:900, protein:47 },
  { id:"mexican_light", label:"Mexican (Walk Only)", desc:"2 soft tacos, ground beef, extra cheese, no chips", cal:750, protein:35 },
  { id:"steak_light", label:"Steakhouse — Light", desc:"Grilled chicken + broccoli + light ranch", cal:500, protein:53 },
  { id:"steak_fries", label:"Steakhouse + Fries (Active)", desc:"Grilled chicken + broccoli + cheese fries + light ranch", cal:1100, protein:55 },
  { id:"steak_steak", label:"Steakhouse — Steak", desc:"Sirloin/filet + sweet potato + vegetables", cal:750, protein:55 },
  { id:"jersey", label:"Jersey Mike's #7 Bowl", desc:"Extra turkey, extra provolone, onions, lettuce, mayo, vinegar + Orgain shake", cal:750, protein:60 },
  { id:"leftovers", label:"Leftovers (Lunch)", desc:"Leftover dinner from night before", cal:600, protein:45 },
];

const SNACKS = [
  { id:"yogurt", label:"Oikos Pro Yogurt", portion:"1 cup", cal:150, protein:20, flag:"best" },
  { id:"cheese_crackers", label:"Cheese & Crackers", portion:"3–4 crackers + 2 slices cheese", cal:170, protein:7, flag:"best" },
  { id:"protein_shake", label:"Orgain Protein Shake", portion:"1 bottle", cal:250, protein:26, flag:"best" },
  { id:"fruit", label:"Fruit", portion:"1 piece or 1 cup", cal:80, protein:1, flag:"free" },
  { id:"boulder", label:"Boulder Chips", portion:"~15 chips / half bag", cal:160, protein:2, flag:"watch" },
  { id:"jal_chips", label:"Jalapeño Lime Chips", portion:"~15 chips / half bag", cal:160, protein:2, flag:"watch" },
  { id:"popcorn", label:"Lesser Evil Popcorn", portion:"3 cups / half bag", cal:150, protein:2, flag:"watch" },
  { id:"pretzels", label:"Thin Pretzels", portion:"15–18 pretzels", cal:160, protein:3, flag:"watch" },
  { id:"drpepper", label:"Dr Pepper Mini Can", portion:"1 can", cal:90, protein:0, flag:"free" },
];

const flagStyle = f => f==="best" ? {background:"#D8F3DC",color:"#2D6A4F"} : f==="watch" ? {background:"#FEF6EE",color:"#B85C1A"} : {background:"#EEF4FF",color:"#3A5FAA"};
const flagLabel = f => f==="best" ? "Best" : f==="watch" ? "Watch it" : "Near free";
const todayKey = () => new Date().toISOString().split("T")[0];
const scoreColor = s => s===null?"#999":s>=85?"#2D6A4F":s>=60?"#E07B39":"#C0392B";
const scoreLabel = s => s===null?"Log your day":s>=85?"Crushed it 🔥":s>=60?"Solid day 👍":"Keep pushing 💪";

const getWeekDates = () => {
  const today = new Date();
  const day = today.getDay();
  return Array.from({length:7},(_,i)=>{
    const d = new Date(today);
    d.setDate(today.getDate()-day+i);
    return d.toISOString().split("T")[0];
  });
};

const emptyLog = () => ({ dayType:null, steps:"", proteinShake:false, meals:[], snacks:[], notes:"" });

function App() {
  const [view, setView] = useState("today");
  const [logs, setLogs] = useState({});
  const [log, setLog] = useState(emptyLog());
  const [saved, setSaved] = useState(false);
  const key = todayKey();

  useEffect(()=>{
    try {
      const stored = localStorage.getItem("fitness_logs_v2");
      if(stored){ const p=JSON.parse(stored); setLogs(p); if(p[key]) setLog(p[key]); }
    } catch(e){}
  },[]);

  const save = updated => {
    const newLogs = {...logs,[key]:updated};
    setLogs(newLogs);
    try { localStorage.setItem("fitness_logs_v2", JSON.stringify(newLogs)); } catch(e){}
    setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  };

  const update = (field,value) => { const u={...log,[field]:value}; setLog(u); save(u); };

  const toggleList = (field,id) => {
    const list = log[field]||[];
    const u = {...log,[field]: list.includes(id)?list.filter(x=>x!==id):[...list,id]};
    setLog(u); save(u);
  };

  const calcScore = l => {
    if(!l||!l.dayType) return null;
    const dt = DAY_TYPES.find(d=>d.id===l.dayType);
    if(!dt) return null;
    let score=0;
    const steps=parseInt(l.steps)||0;
    if(steps>=15000) score+=30; else if(steps>=10000) score+=18; else if(steps>=5000) score+=8;
    const mc=(l.meals||[]).length;
    if(mc>=3) score+=25; else if(mc===2) score+=15; else if(mc===1) score+=8;
    const sc=(l.snacks||[]).length;
    if(sc<=dt.units) score+=25; else if(sc<=dt.units+1) score+=12;
    const needsShake=["walk_lift","walk_sport","all"].includes(l.dayType);
    if(needsShake){ if(l.proteinShake) score+=20; } else score+=20;
    return Math.min(score,100);
  };

  const todayScore = calcScore(log);
  const dt = DAY_TYPES.find(d=>d.id===log.dayType);
  const weekDates = getWeekDates();

  const totalCal = [...(log.meals||[])].reduce((s,id)=>{const m=MEALS.find(x=>x.id===id);return s+(m?m.cal:0);},0)
    +[...(log.snacks||[])].reduce((s,id)=>{const x=SNACKS.find(n=>n.id===id);return s+(x?x.cal:0);},0);
  const totalProtein = [...(log.meals||[])].reduce((s,id)=>{const m=MEALS.find(x=>x.id===id);return s+(m?m.protein:0);},0)
    +[...(log.snacks||[])].reduce((s,id)=>{const x=SNACKS.find(n=>n.id===id);return s+(x?x.protein:0);},0);

  const G = "#2D6A4F"; const border = "1px solid #E0E0DC";
  const card = {background:"#fff",borderRadius:12,padding:16,marginBottom:12,border};
  const sectionTitle = {fontFamily:"'Barlow Condensed'",fontSize:12,letterSpacing:1.5,color:G,textTransform:"uppercase",marginBottom:10,borderBottom:"2px solid #D8F3DC",paddingBottom:8};

  return (
    <div style={{fontFamily:"'Barlow',sans-serif",background:"#F7F7F5",minHeight:"100vh",maxWidth:480,margin:"0 auto",padding:16,paddingBottom:40}}>

      {/* HEADER */}
      <div style={{background:G,borderRadius:14,padding:"18px 20px",marginBottom:14,color:"#fff"}}>
        <div style={{fontFamily:"'Barlow Condensed'",fontSize:11,letterSpacing:2,color:"#D8F3DC",marginBottom:2,textTransform:"uppercase"}}>Daily Playbook</div>
        <div style={{fontFamily:"'Barlow Condensed'",fontSize:26,fontWeight:800,marginBottom:12}}>Fitness Tracker</div>
        <div style={{display:"flex",gap:6}}>
          {["today","week","reference"].map(v=>(
            <button key={v} onClick={()=>setView(v)} style={{padding:"6px 14px",borderRadius:20,fontSize:13,fontWeight:600,background:view===v?"#fff":"rgba(255,255,255,0.15)",color:view===v?G:"#fff"}}>
              {v==="today"?"Today":v==="week"?"This Week":"Reference"}
            </button>
          ))}
        </div>
      </div>

      {/* TODAY */}
      {view==="today" && <div>
        {/* Score card */}
        <div style={{...card,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{...sectionTitle,borderBottom:"none",marginBottom:4,paddingBottom:0}}>Today's Score</div>
            <div style={{fontFamily:"'Barlow Condensed'",fontSize:52,fontWeight:800,color:scoreColor(todayScore),lineHeight:1}}>
              {todayScore!==null?todayScore:"—"}
              {todayScore!==null&&<span style={{fontSize:20,fontWeight:600}}>/100</span>}
            </div>
            <div style={{fontSize:13,color:"#666",marginTop:4}}>{scoreLabel(todayScore)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            {totalCal>0&&<>
              <div style={{fontFamily:"'Barlow Condensed'",fontSize:24,fontWeight:700,color:"#1A1A1A"}}>{totalCal.toLocaleString()}</div>
              <div style={{fontSize:11,color:"#999"}}>cal logged</div>
              <div style={{fontFamily:"'Barlow Condensed'",fontSize:20,fontWeight:700,color:"#40916C",marginTop:6}}>{totalProtein}g</div>
              <div style={{fontSize:11,color:"#999"}}>protein</div>
            </>}
            {saved&&<div style={{fontSize:12,color:G,fontWeight:600,marginTop:8}}>✓ Saved</div>}
          </div>
        </div>

        {/* Day type */}
        <div style={card}>
          <div style={sectionTitle}>What kind of day is it?</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {DAY_TYPES.map(d=>(
              <button key={d.id} onClick={()=>update("dayType",d.id)} style={{background:log.dayType===d.id?d.bg:"#F7F7F5",border:`2px solid ${log.dayType===d.id?d.color:"#E0E0DC"}`,borderRadius:10,padding:"10px",textAlign:"left"}}>
                <div style={{fontFamily:"'Barlow Condensed'",fontSize:13,fontWeight:700,color:"#1A1A1A",marginBottom:2}}>{d.label}</div>
                <div style={{fontSize:11,color:"#666"}}>{d.cal} cal</div>
                <div style={{fontSize:11,fontWeight:700,color:d.color,marginTop:4}}>{d.units} snack units</div>
              </button>
            ))}
          </div>
        </div>

        {/* Steps */}
        <div style={card}>
          <div style={sectionTitle}>Steps Today — Goal: 15,000 (1hr 40min)</div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <input type="number" value={log.steps} onChange={e=>update("steps",e.target.value)} placeholder="Enter steps..."
              style={{flex:1,padding:"10px 14px",borderRadius:10,border:"1.5px solid #E0E0DC",fontSize:18,fontFamily:"'Barlow Condensed'",fontWeight:700,outline:"none",color:"#1A1A1A"}}/>
            <div style={{textAlign:"center",minWidth:56}}>
              <div style={{fontFamily:"'Barlow Condensed'",fontSize:24,fontWeight:800,color:parseInt(log.steps)>=15000?G:"#E07B39"}}>
                {log.steps?`${Math.round((parseInt(log.steps)/15000)*100)}%`:"—"}
              </div>
              <div style={{fontSize:11,color:"#999"}}>of goal</div>
            </div>
          </div>
          {log.steps&&parseInt(log.steps)>=15000&&<div style={{marginTop:8,fontSize:13,color:G,fontWeight:600}}>✓ 15,000 step goal hit!</div>}
          {log.steps&&parseInt(log.steps)<15000&&<div style={{marginTop:8,fontSize:13,color:"#E07B39"}}>{(15000-parseInt(log.steps)).toLocaleString()} steps to go</div>}
        </div>

        {/* Protein shake */}
        {["walk_lift","walk_sport","all"].includes(log.dayType)&&(
          <div style={card}>
            <div style={sectionTitle}>Post-Activity Protein Shake</div>
            <button onClick={()=>update("proteinShake",!log.proteinShake)} style={{width:"100%",padding:"12px 16px",borderRadius:10,fontSize:14,fontWeight:600,background:log.proteinShake?"#D8F3DC":"#F7F7F5",border:`2px solid ${log.proteinShake?G:"#E0E0DC"}`,color:log.proteinShake?G:"#666",display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:20}}>{log.proteinShake?"✅":"⬜"}</span>
              {log.proteinShake?"Orgain shake done — great work":"Tap when you've had your shake"}
            </button>
          </div>
        )}

        {/* Meals */}
        <div style={card}>
          <div style={sectionTitle}>Meals Eaten Today</div>
          {MEALS.map((m,i)=>(
            <button key={m.id} onClick={()=>toggleList("meals",m.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:i<MEALS.length-1?"1px solid #F0F0EC":"none",background:"none",textAlign:"left"}}>
              <span style={{fontSize:18,flexShrink:0}}>{(log.meals||[]).includes(m.id)?"✅":"⬜"}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600,color:"#1A1A1A"}}>{m.label}</div>
                <div style={{fontSize:12,color:"#888"}}>{m.desc}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:600,color:G}}>{m.protein}g</div>
                <div style={{fontSize:11,color:"#999"}}>{m.cal} cal</div>
              </div>
            </button>
          ))}
        </div>

        {/* Snacks */}
        <div style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,borderBottom:"2px solid #D8F3DC",paddingBottom:8}}>
            <div style={{fontFamily:"'Barlow Condensed'",fontSize:12,letterSpacing:1.5,color:G,textTransform:"uppercase"}}>Snack Units</div>
            {dt&&<div style={{fontSize:13,fontWeight:700,color:(log.snacks||[]).length<=dt.units?G:"#C0392B"}}>{(log.snacks||[]).length} / {dt.units} units</div>}
          </div>
          {SNACKS.map((s,i)=>(
            <button key={s.id} onClick={()=>toggleList("snacks",s.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:i<SNACKS.length-1?"1px solid #F0F0EC":"none",background:"none",textAlign:"left"}}>
              <span style={{fontSize:18,flexShrink:0}}>{(log.snacks||[]).includes(s.id)?"✅":"⬜"}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600,color:"#1A1A1A"}}>{s.label}</div>
                <div style={{fontSize:12,color:"#888"}}>{s.portion}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                <span style={{...flagStyle(s.flag),fontSize:11,fontWeight:600,padding:"2px 7px",borderRadius:10}}>{flagLabel(s.flag)}</span>
                <div style={{fontSize:11,color:"#999",minWidth:44,textAlign:"right"}}>{s.cal} cal</div>
              </div>
            </button>
          ))}
        </div>

        {/* Notes */}
        <div style={card}>
          <div style={sectionTitle}>Notes (optional)</div>
          <textarea value={log.notes} onChange={e=>update("notes",e.target.value)} placeholder="How did today feel? Anything to remember..."
            style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid #E0E0DC",fontSize:13,resize:"none",height:72,outline:"none",color:"#1A1A1A"}}/>
        </div>
      </div>}

      {/* WEEK */}
      {view==="week"&&<div>
        <div style={card}>
          <div style={sectionTitle}>This Week</div>
          {weekDates.map((date,i)=>{
            const l=logs[date]; const s=calcScore(l); const isToday=date===key;
            const d=new Date(date+"T12:00:00");
            return (
              <div key={date} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 8px",borderBottom:i<6?"1px solid #F0F0EC":"none",background:isToday?"#F0FBF4":"none",borderRadius:isToday?8:0}}>
                <div style={{minWidth:36,textAlign:"center"}}>
                  <div style={{fontFamily:"'Barlow Condensed'",fontSize:13,fontWeight:700,color:isToday?G:"#666"}}>{DAYS[d.getDay()]}</div>
                  <div style={{fontSize:11,color:"#999"}}>{d.getDate()}</div>
                </div>
                <div style={{flex:1}}>
                  {l?.dayType?<>
                    <div style={{fontSize:13,fontWeight:600,color:"#1A1A1A"}}>{DAY_TYPES.find(x=>x.id===l.dayType)?.label}</div>
                    <div style={{fontSize:11,color:"#888",marginTop:2}}>
                      {l.steps?`${parseInt(l.steps).toLocaleString()} steps`:"No steps"} · {(l.meals||[]).length} meals · {(l.snacks||[]).length} snacks
                    </div>
                  </>:<div style={{fontSize:13,color:"#bbb"}}>{isToday?"Log today →":"Not logged"}</div>}
                </div>
                <div style={{textAlign:"center",minWidth:48}}>
                  <div style={{fontFamily:"'Barlow Condensed'",fontSize:24,fontWeight:800,color:s!==null?scoreColor(s):"#DDD"}}>{s!==null?s:"—"}</div>
                  {s!==null&&<div style={{fontSize:10,color:"#999"}}>/100</div>}
                </div>
              </div>
            );
          })}
        </div>

        {(()=>{
          const scored=weekDates.map(d=>calcScore(logs[d])).filter(s=>s!==null);
          if(!scored.length) return <div style={{textAlign:"center",color:"#bbb",fontSize:14,padding:20}}>Start logging days to see your weekly summary</div>;
          const avg=Math.round(scored.reduce((a,b)=>a+b,0)/scored.length);
          const totalSteps=weekDates.reduce((sum,d)=>sum+(parseInt(logs[d]?.steps)||0),0);
          const perfectDays=scored.filter(s=>s>=85).length;
          return (
            <div style={{background:G,borderRadius:12,padding:16,color:"#fff"}}>
              <div style={{fontFamily:"'Barlow Condensed'",fontSize:12,letterSpacing:1.5,color:"#D8F3DC",textTransform:"uppercase",marginBottom:12}}>Week Summary</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
                {[{val:avg,label:"Avg score"},{val:perfectDays,label:"Great days (85+)"},{val:`${Math.round(totalSteps/1000)}k`,label:"Total steps"}].map(({val,label})=>(
                  <div key={label} style={{textAlign:"center"}}>
                    <div style={{fontFamily:"'Barlow Condensed'",fontSize:32,fontWeight:800}}>{val}</div>
                    <div style={{fontSize:11,color:"#D8F3DC"}}>{label}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
      </div>}

      {/* REFERENCE */}
      {view==="reference"&&<div>
        <div style={card}>
          <div style={sectionTitle}>Snack Unit Portions</div>
          {SNACKS.map((s,i)=>(
            <div key={s.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:i<SNACKS.length-1?"1px solid #F0F0EC":"none",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:500}}>{s.label}</div>
                <div style={{fontSize:12,color:"#888"}}>{s.portion}</div>
              </div>
              <span style={{...flagStyle(s.flag),fontSize:11,fontWeight:600,padding:"2px 7px",borderRadius:10,flexShrink:0}}>{flagLabel(s.flag)}</span>
            </div>
          ))}
        </div>

        <div style={card}>
          <div style={sectionTitle}>Snack Timing — Activity Days</div>
          {[
            {when:"1–2 hrs before",what:"1 snack unit as fuel — fruit + RX bar or cheese & crackers"},
            {when:"Right after",what:"Protein shake immediately — kills hunger before it spirals"},
            {when:"After dinner",what:"1 unit max — yogurt or fruit preferred"},
          ].map((r,i)=>(
            <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",padding:"9px 0",borderBottom:i<2?"1px solid #F0F0EC":"none"}}>
              <div style={{fontFamily:"'Barlow Condensed'",fontSize:13,fontWeight:700,color:"#E07B39",textTransform:"uppercase",minWidth:90,paddingTop:1}}>{r.when}</div>
              <div style={{fontSize:13,color:"#4A4A4A",lineHeight:1.5}}>{r.what}</div>
            </div>
          ))}
        </div>

        <div style={card}>
          <div style={sectionTitle}>Eating Out Guide</div>
          {[
            {place:"Chipotle",order:"Chicken bowl, brown rice, extra cheese, extra corn, pico, lettuce",cal:725,protein:52},
            {place:"Mexican (Active day)",order:"3 soft tacos, ground beef, extra cheese — limit chips to 10 max",cal:900,protein:47},
            {place:"Mexican (Walk only)",order:"2 soft tacos, ground beef, extra cheese, no chips",cal:750,protein:35},
            {place:"Steakhouse — Light",order:"Grilled chicken + broccoli + light ranch on side",cal:500,protein:53},
            {place:"Steakhouse + Fries",order:"Grilled chicken + broccoli + cheese fries + light ranch (active days only)",cal:1100,protein:55},
            {place:"Steakhouse — Steak",order:"Sirloin or filet + sweet potato + vegetables",cal:750,protein:55},
            {place:"Jersey Mike's",order:"#7 bowl, extra turkey, extra provolone, onions, lettuce, mayo, vinegar + Orgain shake",cal:750,protein:60},
          ].map((e,i,arr)=>(
            <div key={i} style={{padding:"10px 0",borderBottom:i<arr.length-1?"1px solid #F0F0EC":"none"}}>
              <div style={{fontSize:14,fontWeight:600,marginBottom:2}}>{e.place}</div>
              <div style={{fontSize:12,color:"#888",marginBottom:4}}>{e.order}</div>
              <div style={{display:"flex",gap:12}}>
                <span style={{fontSize:12,fontWeight:600,color:G}}>{e.protein}g protein</span>
                <span style={{fontSize:12,color:"#999"}}>{e.cal} cal</span>
              </div>
            </div>
          ))}
        </div>

        <div style={card}>
          <div style={sectionTitle}>Golden Rules</div>
          {[
            "Protein shake immediately after any sport or lifting",
            "Don't undereat on heavy days — your body needs fuel",
            "Chips = half the bag max per sitting, always",
            "Skip the bread basket eating out — 400 empty calories",
            "Sauces and dressings on the side every time",
            "Prioritize yogurt and cheese snacks over chips",
            "After dinner = 1 snack unit max, then done",
          ].map((r,i,arr)=>(
            <div key={i} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:i<arr.length-1?"1px solid #F0F0EC":"none",fontSize:13,color:"#4A4A4A",lineHeight:1.5}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:"#E07B39",marginTop:5,flexShrink:0}}/>
              {r}
            </div>
          ))}
        </div>

        <div style={{textAlign:"center",fontSize:12,color:"#aaa",padding:"8px 0 20px"}}>
          6'3" · 254 lbs → 225–230 lbs · 15,000 steps/day
        </div>
      </div>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
